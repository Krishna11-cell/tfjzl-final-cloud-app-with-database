<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Result</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success"><div class="container"><span class="navbar-brand">Online Course App</span></div></nav><main class="container py-5"><div class="card shadow-sm mx-auto" style="max-width:720px"><div class="card-body text-center p-5"><h1 class="text-success">Congratulations!</h1><p class="lead">Your mock exam has been submitted successfully.</p><div class="display-5 fw-bold">{{ submission.score }}</div><p class="text-muted">Score points</p><p>Course: <strong>{{ submission.course.name }}</strong></p><p>Questions answered: <strong>{{ submission.total_questions }}</strong></p><p>Submitted: {{ submission.submitted_at|date:"M d, Y H:i" }}</p><a class="btn btn-primary mt-3" href="{% url 'course_details' submission.course.id %}">Back to course</a></div></div></main></body></html>
