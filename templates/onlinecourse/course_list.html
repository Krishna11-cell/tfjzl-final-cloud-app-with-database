<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Course App</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><span class="navbar-brand">Online Course App</span></div></nav><main class="container py-5"><h1 class="mb-4">Available Courses</h1><div class="row g-3">{% for course in courses %}<div class="col-md-6"><div class="card h-100 shadow-sm"><div class="card-body"><h2 class="h5">{{ course.name }}</h2><p>{{ course.description }}</p><a class="btn btn-primary" href="{% url 'course_details' course.id %}">View course</a></div></div></div>{% empty %}<p>No courses yet. Add one through <a href="/admin/">Django admin</a>.</p>{% endfor %}</div></main></body></html>
